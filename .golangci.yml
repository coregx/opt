# GolangCI-Lint v2 Configuration for coregx/opt
# Documentation: https://golangci-lint.run/docs/configuration/
# Based on: coregx/fursy, coregx/stream (enterprise reference configs)

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    # Code quality and complexity
    - gocyclo
    - gocognit
    - funlen
    - maintidx
    - cyclop
    - nestif

    # Bug detection
    - govet
    - staticcheck
    - errcheck
    - errorlint
    - gosec
    - nilnil
    - nilerr
    - nilnesserr
    - ineffassign

    # Code style and consistency
    - misspell
    - whitespace
    - unconvert
    - unparam

    # Naming conventions
    - errname
    - revive

    # Performance
    - prealloc
    - makezero

    # Code practices
    - goconst
    - gocritic
    - goprintffuncname
    - nolintlint
    - nakedret

    # Comments and documentation
    - godot

    # Additional quality checkers
    - dupl
    - dogsled
    - durationcheck

  settings:
    govet:
      enable:
        - copylocks
      disable:
        - fieldalignment

    gocyclo:
      min-complexity: 15

    cyclop:
      max-complexity: 15

    funlen:
      lines: 120
      statements: 60

    gocognit:
      min-complexity: 20

    misspell:
      locale: US

    nestif:
      min-complexity: 4

    revive:
      rules:
        - name: var-naming
        - name: exported
        - name: error-return
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - commentFormatting
        - whyNoLint
        - unnamedResult
        - commentedOutCode
      settings:
        hugeParam:
          sizeThreshold: 256

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - cyclop
          - funlen
          - maintidx
          - errcheck
          - gosec
          - goconst
          - dupl

      - path: ".*\\.pb\\.go"
        linters:
          - revive
          - gocritic

      - path: internal/.*\.go
        linters:
          - godot

      # int16/int32/byte types are structurally identical by design (one type per file).
      # Each type wraps a different Go primitive — code duplication is intentional, not refactorable.
      - path: (int16|int32|int16_test|int32_test|byte)\.go
        linters:
          - dupl

      - path: zero/(int16|int32|byte)\.go
        linters:
          - dupl

      # G115: int64→int16/int32 conversions are safe — internal.UnmarshalIntJSON
      # validates range before returning. Overflow is caught at the parsing layer.
      - linters:
          - gosec
        text: "G115"


issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
